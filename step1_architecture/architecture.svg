<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .col{font-size:15px;font-weight:700;fill:#0f172a}
      .grp{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .s3{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
      .wf{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4}
      .fm{fill:#fff7ed;stroke:#f97316;stroke-width:1.4}
      .out{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.4}
      .t{font-size:13px;fill:#0f172a;text-anchor:middle}
      .s{font-size:11px;fill:#475569;text-anchor:middle}
      .l{font-size:11px;fill:#334155}
      .ln{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dl{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a);stroke-dasharray:5 4}
      .bi{stroke:#f97316;stroke-width:1.6;fill:none;marker-end:url(#a);marker-start:url(#a)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Insurance claim processing PoC - Amazon S3 + Amazon Bedrock</text>

  <!-- column headings -->
  <text class="col" x="40" y="66">1. Document storage + policy RAG</text>
  <text class="col" x="345" y="66">2. Processing workflow (Python)</text>
  <text class="col" x="700" y="66">3. Foundation models (Bedrock)</text>
  <text class="col" x="1000" y="66">4. Response generation</text>

  <!-- ===== Column 1: S3 + KB ===== -->
  <rect class="grp" x="30" y="80" width="270" height="140" rx="10"/>
  <text class="l" x="44" y="100" font-weight="700">Amazon S3  claim-documents-poc-xx</text>
  <rect class="s3" x="60" y="110" width="210" height="44" rx="8"/>
  <text class="t" x="165" y="130">claims/</text><text class="s" x="165" y="146">txt · md · pdf · docx uploads</text>
  <rect class="s3" x="60" y="164" width="210" height="44" rx="8"/>
  <text class="t" x="165" y="184">policies/</text><text class="s" x="165" y="200">policy wording (AUTO, HOME, HLT)</text>

  <rect class="grp" x="30" y="250" width="270" height="250" rx="10"/>
  <text class="l" x="44" y="270" font-weight="700">Policy knowledge base (simple RAG)</text>
  <rect class="wf" x="60" y="282" width="210" height="44" rx="8"/>
  <text class="t" x="165" y="302">Chunk by policy section</text><text class="s" x="165" y="318">+ product metadata</text>
  <rect class="fm" x="60" y="350" width="210" height="44" rx="8"/>
  <text class="t" x="165" y="370">Titan Text Embeddings V2</text><text class="s" x="165" y="386">512-dim vectors</text>
  <rect class="s3" x="60" y="418" width="210" height="58" rx="8"/>
  <text class="t" x="165" y="440">Vector index</text><text class="s" x="165" y="456">cosine similarity, filter by</text><text class="s" x="165" y="469">policy prefix (PoC: JSON file)</text>
  <path class="ln" d="M255 208 L255 280"/>
  <path class="ln" d="M165 326 L165 348"/>
  <path class="ln" d="M165 394 L165 416"/>

  <!-- ===== Column 2: workflow ===== -->
  <rect class="grp" x="330" y="80" width="320" height="560" rx="10"/>
  <g>
    <rect class="wf" x="350" y="96" width="280" height="48" rx="8"/>
    <text class="t" x="490" y="117">① Read document from S3</text><text class="s" x="490" y="134">text inline · PDF/DOCX as document block</text>
    <rect class="wf" x="350" y="166" width="280" height="48" rx="8"/>
    <text class="t" x="490" y="187">② Content filter</text><text class="s" x="490" y="204">redact SSN, IBAN, card, e-mail, phone</text>
    <rect class="wf" x="350" y="236" width="280" height="48" rx="8"/>
    <text class="t" x="490" y="257">③ Extract fields</text><text class="s" x="490" y="274">template extract_info v1.1 · temp 0</text>
    <rect class="wf" x="350" y="306" width="280" height="48" rx="8"/>
    <text class="t" x="490" y="327">④ Validate JSON</text><text class="s" x="490" y="344">schema · types · grounding · repair retry</text>
    <rect class="wf" x="350" y="402" width="280" height="48" rx="8"/>
    <text class="t" x="490" y="423">⑤ Retrieve policy clauses</text><text class="s" x="490" y="440">top-4 sections for this incident</text>
    <rect class="wf" x="350" y="472" width="280" height="48" rx="8"/>
    <text class="t" x="490" y="493">⑥ Generate summary</text><text class="s" x="490" y="510">template generate_summary v1.2 · temp 0.3</text>
    <rect class="wf" x="350" y="542" width="280" height="48" rx="8"/>
    <text class="t" x="490" y="563">⑦ Validate summary</text><text class="s" x="490" y="580">sections · citations · facts · no PII</text>
  </g>
  <path class="ln" d="M490 144 L490 164"/>
  <path class="ln" d="M490 214 L490 234"/>
  <path class="ln" d="M490 284 L490 304"/>
  <path class="ln" d="M490 354 L490 400"/>
  <text class="l" x="460" y="384" text-anchor="end">valid ↓</text>
  <path class="ln" d="M630 340 C 648 340, 648 260, 632 260"/>
  <text class="l" x="640" y="372" text-anchor="end" fill="#b91c1c">↻ invalid → repair_json</text>
  <path class="ln" d="M490 450 L490 470"/>
  <path class="ln" d="M490 520 L490 540"/>
  <text class="s" x="490" y="612">Step 3 reusable components:</text><text class="s" x="490" y="627" font-size="10">PromptTemplateManager · ModelInvoker · ContentValidator</text>

  <!-- storage -> workflow -->
  <path class="ln" d="M270 132 L348 120"/>
  <path class="dl" d="M270 447 L348 426"/>
  <text class="l" x="282" y="420">similarity</text><text class="l" x="282" y="433">search</text>

  <!-- ===== Column 3: Bedrock ===== -->
  <rect class="grp" x="690" y="80" width="270" height="560" rx="10"/>
  <text class="l" x="704" y="100" font-weight="700">Amazon Bedrock · Converse API</text>
  <rect class="fm" x="710" y="226" width="230" height="68" rx="8"/>
  <text class="t" x="825" y="248" font-weight="700">Amazon Nova Pro</text>
  <text class="s" x="825" y="265">document understanding +</text><text class="s" x="825" y="279">information extraction (multimodal)</text>
  <rect class="fm" x="710" y="462" width="230" height="68" rx="8"/>
  <text class="t" x="825" y="484" font-weight="700">Amazon Nova Lite</text>
  <text class="s" x="825" y="501">summary generation</text><text class="s" x="825" y="515">fast, low cost, 300K context</text>
  <rect class="fm" x="710" y="340" width="230" height="78" rx="8" stroke-dasharray="4 3"/>
  <text class="t" x="825" y="360">Compared in Step 4</text>
  <text class="s" x="825" y="377">Nova Micro · Nova Lite · Nova Pro</text>
  <text class="s" x="825" y="392">Claude 3 Haiku</text>
  <text class="s" x="825" y="407">(any model ID - same Converse API)</text>
  <text class="s" x="825" y="128">retries + backoff on throttling</text>
  <text class="s" x="825" y="144">latency · tokens · cost per call</text>
  <path class="bi" d="M632 260 L708 260"/>
  <path class="bi" d="M632 496 L708 496"/>

  <!-- ===== Column 4: response ===== -->
  <rect class="grp" x="990" y="80" width="260" height="560" rx="10"/>
  <rect class="out" x="1010" y="402" width="220" height="72" rx="8"/>
  <text class="t" x="1120" y="424" font-weight="700">Result JSON</text>
  <text class="s" x="1120" y="441">fields · summary · validation ·</text><text class="s" x="1120" y="455">policy sections · metrics</text>
  <rect class="s3" x="1010" y="300" width="220" height="44" rx="8"/>
  <text class="t" x="1120" y="320">S3 results/</text><text class="s" x="1120" y="336">audit trail</text>
  <rect class="out" x="1010" y="530" width="220" height="60" rx="8"/>
  <text class="t" x="1120" y="552" font-weight="700">Claims staff · Flask UI</text>
  <text class="s" x="1120" y="570">upload · review · 👍 / 👎</text>
  <rect class="s3" x="1010" y="160" width="220" height="44" rx="8"/>
  <text class="t" x="1120" y="180">S3 feedback/</text><text class="s" x="1120" y="196">ratings for prompt tuning</text>
  <path class="ln" d="M630 566 L670 566 L670 658 L975 658 L975 438 L1008 438"/>
  <path class="ln" d="M1120 402 L1120 346"/>
  <path class="ln" d="M1120 474 L1120 528"/>
  <path class="ln" d="M1240 560 C 1270 520, 1270 200, 1232 184"/>
  <text class="l" x="1004" y="642" text-anchor="end"> </text>

  <text x="640" y="700" text-anchor="middle" font-size="12" fill="#475569">Solid arrows: data flow · dashed: retrieval · orange double arrows: model invocation (request/response)</text>
</svg>
